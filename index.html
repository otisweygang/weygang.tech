<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>weygang</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23111'/%3E%3Cpath d='M6 8l3.5 16L13 12l3 12 3.5-12L23 24 26.5 8' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>

  <div class="crt">
    <canvas class="starfield" id="starfield"></canvas>
    <div class="crt-sweep"></div>

    <header class="header">
      <span class="brand">WEYGANG<span class="blink">_</span></span>
      <span class="header-actions">
        <button id="help-button" type="button">[help]</button>
        <button id="theme-button" type="button">[theme]</button>
        <button id="reboot-button" type="button">[reboot]</button>
      </span>
    </header>

    <main class="terminal" id="terminal"></main>
  </div>

  <div class="preview-backdrop" id="preview-backdrop" hidden></div>
  <aside class="preview" id="preview" hidden>
    <div class="preview-bar">
      <span class="preview-title" id="preview-title"></span>
      <span class="preview-actions">
        <a class="preview-open" id="preview-open" target="_blank" rel="noopener"></a>
        <button class="preview-close" id="preview-close" type="button"></button>
      </span>
    </div>
    <div class="preview-body" id="preview-body"></div>
  </aside>

  <div class="help-backdrop" id="help-backdrop" hidden></div>
  <aside class="help-panel" id="help-panel" hidden>
    <div class="help-bar">
      <span class="help-title" id="help-title"></span>
      <button class="help-close" id="help-close" type="button">×</button>
    </div>
    <div class="help-body" id="help-body"></div>
  </aside>

  <div class="matrix" id="matrix" hidden>
    <div class="matrix-hint">// press ESC or click to return</div>
  </div>

  <div class="crash" id="crash" hidden>
    <div class="crash-face">:(</div>
    <p>Your portfolio ran into a problem described as <b>"too boring"</b> and needs to restart.</p>
    <p>We're just collecting some error info, and then we'll pretend this never happened.</p>
    <p class="crash-progress" id="crash-progress">0% complete</p>
    <small>Stop code: BORING_TESTER_EXCEPTION &nbsp;·&nbsp; click anywhere to recover</small>
  </div>

  <script src="./content.js"></script>
  <!-- project demos: one file per project, registers on window.projectDemos -->
  <script src="./demos/urlstatuscheck.js"></script>
  <script src="./demo.js"></script>
  <script src="./preview.js"></script>
  <script src="./main.js"></script>
</body>
</html>
