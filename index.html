<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weygang</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="./styles.css" />
</head>
<body>

  <div class="frame">

    <header class="bar bar-top">
      <span class="mark">weygang<span class="caret">_</span></span>
      <span class="bar-right">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle colour theme">
          <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
          <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        </button>
        <a class="gh" href="https://github.com/otisweygang" target="_blank" rel="noopener">github &nearr;</a>
      </span>
    </header>

    <!-- the tiling area: card list | detail window (slides in) -->
    <main class="stage" id="stage">

      <section class="win win-list" id="win-list">
        <div class="win-bar">
          <span class="win-path">~/weygang</span>
          <span class="win-count" id="list-count"></span>
        </div>
        <div class="nav-cards" id="cards"><!-- filled by app.js --></div>
      </section>

      <section class="win win-detail" id="win-detail" hidden>
        <div class="win-bar">
          <span class="win-path" id="detail-path">~/</span>
          <span class="win-tabs">
            <button class="win-tab is-active" data-view="preview" type="button">preview</button>
            <button class="win-tab" data-view="source" type="button">source</button>
            <button class="win-icon win-expand" id="detail-expand" type="button" aria-label="Expand pane">
              <svg class="ic ic-expand" width="13" height="13" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 4h6v6M20 4l-7 7" />
                <path d="M10 20H4v-6M4 20l7-7" />
              </svg>
              <svg class="ic ic-collapse" width="13" height="13" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 10h-6V4M14 10l6-6" />
                <path d="M4 14h6v6M10 14l-6 6" />
              </svg>
            </button>
            <button class="win-icon win-close" id="detail-close" type="button" aria-label="Close">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 6l12 12M18 6L6 18" />
              </svg>
            </button>
          </span>
        </div>
        <div class="detail-body" id="detail-body"><!-- filled by app.js --></div>
      </section>

    </main>

    <footer class="bar bar-bottom">
      <span class="spacer"></span>
      <span class="utc" id="utc">------ --:--:-- UTC</span>
    </footer>

  </div>

  <script src="./app.js"></script>
</body>
</html>
